[project]
name = "quickspec"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.2",
    "onnxruntime>=1.28.0",
    "openai>=2.51.0",
    "openrouter>=1.1.21",
    "platformdirs>=4.11.3",
    "pymupdf>=1.28.0",
    "pymupdf4llm>=1.28.0",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "sentence-transformers[onnx]>=5.6.1",
    "tiktoken>=0.13.0",
    "tqdm>=4.70.0",
    "typer>=0.27.0",
    "usearch>=2.26.0",
]

[project.scripts]
quickspec = "main.cli:app"

[tool.setuptools.packages.find]
include = ["main*", "eval*"]
exclude = ["data*"]
